# Cloud Build: Factumflux Frontend Monorepo Deployment
# Deploys 3 separate Cloud Run micro-frontends:
# 1. factumflux-backoffice
# 2. factumflux-portal-proveedor
# 3. factumflux-landing

steps:
  # ── APP 1: BACKOFFICE & SUPERADMIN ───────────────────────────────────────
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/backoffice:latest
      - --build-arg=APP_NAME=backoffice
      - --build-arg=VITE_API_BASE_URL=https://factumflux-backend-pxeov3gtya-tl.a.run.app
      - --cache=true
      - --cache-repo=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/cache
      - --cache-ttl=168h

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - factumflux-backoffice
      - --image=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/backoffice:latest
      - --region=southamerica-west1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --cpu=1
      - --memory=256Mi

  # ── APP 2: PORTAL PROVEEDOR ──────────────────────────────────────────────
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/portal-proveedor:latest
      - --build-arg=APP_NAME=portal-proveedor
      - --build-arg=VITE_API_BASE_URL=https://factumflux-backend-pxeov3gtya-tl.a.run.app
      - --cache=true
      - --cache-repo=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/cache
      - --cache-ttl=168h

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - factumflux-portal-proveedor
      - --image=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/portal-proveedor:latest
      - --region=southamerica-west1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --cpu=1
      - --memory=256Mi

  # ── APP 3: LANDING CORPORATIVA ────────────────────────────────────────────
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/landing:latest
      - --build-arg=APP_NAME=landing
      - --build-arg=VITE_API_BASE_URL=https://factumflux-backend-pxeov3gtya-tl.a.run.app
      - --cache=true
      - --cache-repo=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/cache
      - --cache-ttl=168h

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - factumflux-landing
      - --image=southamerica-west1-docker.pkg.dev/$PROJECT_ID/factumflux/landing:latest
      - --region=southamerica-west1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --cpu=1
      - --memory=256Mi

options:
  logging: CLOUD_LOGGING_ONLY
